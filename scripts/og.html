<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@700&display=block">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#07080d;color:#eceef4;font-family:Inter,sans-serif;overflow:hidden;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(35% 50% at 10% 15%,rgba(249,115,22,.26),transparent 70%),radial-gradient(35% 50% at 40% 0%,rgba(79,70,229,.3),transparent 70%),radial-gradient(35% 50% at 75% 95%,rgba(16,185,129,.22),transparent 70%),radial-gradient(35% 50% at 100% 35%,rgba(14,165,233,.26),transparent 70%)}

.c{position:absolute;inset:0;padding:64px 90px;display:flex;flex-direction:column;justify-content:center}
.row{display:flex;align-items:center;gap:28px}
.row img{border-radius:36px;box-shadow:0 20px 50px -12px rgba(79,70,229,.6)}
.name{font:700 60px 'Space Grotesk';letter-spacing:-.02em}.name span{color:#9ba1b3}
h1{font:700 66px/1.04 'Space Grotesk';letter-spacing:-.03em;margin-top:36px}
h1 span{background:linear-gradient(100deg,#f97316,#e11d48 22%,#4f46e5 45%,#0ea5e9 70%,#10b981);-webkit-background-clip:text;color:transparent}
p{font-size:28px;color:#b6bbca;margin-top:24px}
.tags{display:flex;gap:12px;margin-top:32px}
.tags b{font:500 20px 'JetBrains Mono';padding:8px 16px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(255,255,255,.05);color:#dbe0ee}
